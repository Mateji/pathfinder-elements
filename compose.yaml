services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pathfinder
      POSTGRES_USER: pathfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL-Passwort setzen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pathfinder", "-d", "pathfinder"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    environment:
      Database__Host: db
      Database__Name: pathfinder
      Database__Username: pathfinder
      Database__Password: ${POSTGRES_PASSWORD:?PostgreSQL-Passwort setzen}
      Database__MigrateOnStartup: "true"
      Auth__KeyDirectory: /var/lib/pathfinder/keys
      Auth__TrustedProxy: ${AUTH_TRUSTED_PROXY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    volumes:
      - auth_keys:/var/lib/pathfinder/keys

volumes:
  postgres_data:
  auth_keys:
