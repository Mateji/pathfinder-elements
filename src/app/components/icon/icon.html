<svg
    class="icon-badge"
    [attr.width]="size"
    [attr.height]="size"
    viewBox="0 0 100 100"
    [style.color]="fill || null">
    <use
        [attr.href]="spriteHref"
        [attr.xlink:href]="spriteHref"
        x="10"
        y="10"
        width="80"
        height="80"></use>

    <!-- number on top -->
    @if (value !== null && value !== undefined) {
    <text
        x="50"
        y="58"
        text-anchor="middle"
        dominant-baseline="middle"
        class="icon-number">
        {{ value }}
    </text>
    }
</svg>
